<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        .header {
            background: linear-gradient(135deg, #6aa469 0%, #175b98 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        .content {
            padding: 40px 20px;
        }
        .greeting {
            font-size: 16px;
            margin-bottom: 20px;
            color: #333;
        }
        .message-body {
            margin: 25px 0;
            line-height: 1.8;
            color: #555;
        }
        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 30px 0;
        }
        .footer {
            background-color: #f4f7fa;
            padding: 25px 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }
        .footer p {
            margin: 5px 0;
        }
        .footer a {
            color: #6aa469;
            text-decoration: none;
        }
        .footer-divider {
            color: #999;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Message from Tūhura Tech</h1>
        </div>
        
        <div class="content">
            <p class="greeting">Hi {{ caregiver_name }},</p>
            
            <div class="message-body">
                {{ message }}
            </div>
            
            <div class="divider"></div>
        </div>

        <div class="footer">
            <p><strong>Tūhura Tech</strong></p>
            <p>
                {% if support_email %}
                <a href="mailto:{{ support_email }}">Contact Support</a>
                <span class="footer-divider">|</span>
                {% endif %}
                <a href="https://tuhuratech.org.nz/">Visit Website</a>
            </p>
            <p style="margin-top: 10px; color: #999;">© 2025 Tūhura Tech. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
