version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:18@sha256:52e6ffd11fddd081ae63880b635b2a61c14008c17fc98cdc7ce5472265516dd0
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessions"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: docker.io/library/redis:8-alpine@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1
    container_name: sessions-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://sessions:sessions@postgres:5432/sessions
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - ADMIN_BASE_URL=${ADMIN_BASE_URL:-http://localhost:3002}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:4321}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"

  worker:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://sessions:sessions@postgres:5432/sessions
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - ADMIN_BASE_URL=${ADMIN_BASE_URL:-http://localhost:3002}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:4321}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["app", "workers", "run"]

  migrator:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: "no"
    command: litestar database upgrade --no-prompt
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://sessions:sessions@postgres:5432/sessions
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-portal:
    build:
      context: admin_portal
      dockerfile: Dockerfile
      args:
        # PUBLIC_BASE_URL is baked into the static build at container build time
        # This is NOT a runtime environment variable - the app is fully static
        - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "8080:80"


  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # PUBLIC_BASE_URL is baked into client-side code at build time
        - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
    env_file:
      - .env
    environment:
      # INTERNAL_API_URL: used by server-side code for Docker-internal networking
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:8000}
      # PUBLIC_BASE_URL: used by server-side code for client-side requests
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "4321:4321"

volumes:
  postgres_data:
  redis_data: